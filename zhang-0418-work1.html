<!-- 阅读顺序：第一部分欢迎页，第二部分个人简介，第三部分语言切换，第四部分页面切换。
     HTML、CSS、JavaScript 均为可读源码；仅照片采用 Base64 数据以保证单文件使用。
     每张图片的数据按行排列；阅读布局时可折叠 img 标签。 -->
<iframe id="welcome-frame" title="欢迎页"></iframe>
<iframe id="profile-frame" title="个人简介、目标规划、日常生活" hidden></iframe>

<!-- ===== 第一部分：欢迎页 HTML 与 CSS ===== -->
<script type="text/html" id="home-source">
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4d78a6">
    <meta name="description" content="欢迎来到我的个人网页，和猫猫一起开启探索。">
    <title>欢迎来到我的个人网页</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='54'%3E🐱%3C/text%3E%3C/svg%3E">
    <style>
/* 第一页：欢迎卡片与猫猫进入按钮。后面的规则用于手机适配和样式覆盖。 */
* {
  box-sizing: border-box;
  
}
html {
  color-scheme: light;
  background: #507ba8;
  
}
body {
  margin: 0;
  color: #fffdf0;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  
}
.sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 48%;
  z-index: -2;
  
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, rgba(24, 55, 89, .06), rgba(24, 55, 89, .2));
  z-index: -1;
  pointer-events: none;
  
}
main {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 40px 24px;
  
}
.welcome {
  position: relative;
  width: min(760px, 100%);
  min-height: 400px;
  padding: 76px 46px 130px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  background: rgba(28, 57, 86, .32);
  border: 1px solid rgba(255, 255, 244, .56);
  border-radius: 26px;
  box-shadow: 0 20px 70px rgba(17, 43, 72, .16), inset 0 1px rgba(255,255,255,.16);
  animation: appear .9s ease both;
  
}
.eyebrow {
  margin: 0 0 28px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .25em;
  color: #fff4cf;
  
}
h1 {
  margin: 0;
  font-size: clamp(27px, 4.5vw, 44px);
  line-height: 1.5;
  font-weight: 600;
  letter-spacing: .055em;
  text-shadow: 0 2px 12px rgba(15, 39, 66, .65);
  
}
.invitation {
  margin: 20px 0 0;
  font-size: clamp(17px, 2.4vw, 23px);
  line-height: 1.9;
  letter-spacing: .09em;
  text-shadow: 0 2px 9px rgba(15, 39, 66, .8);
  
}
.cat-link {
  position: absolute;
  right: 30px;
  bottom: 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  color: #fffbed;
  text-decoration: none;
  border-radius: 20px;
  padding: 8px 12px;
  transition: background .2s, transform .2s;
  
}
.cat-link:hover {
  background: rgba(255,255,255,.13);
  transform: translateY(-4px);
  
}
.cat-link:focus-visible {
  outline: 3px solid #fff4b5;
  outline-offset: 5px;
  
}
.cat-label {
  font-size: 15px;
  letter-spacing: .1em;
  text-shadow: 0 1px 5px #34516e;
  
}
.cat {
  display: grid;
  place-items: center;
  width: 72px;
  height: 72px;
  font-size: 54px;
  line-height: 1;
  filter: drop-shadow(0 5px 6px rgba(20,44,73,.22));
  transform-origin: bottom center;
  
}
.cat-link:hover .cat {
  animation: wiggle .5s ease;
  
}
@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
    
  }
  to {
    opacity: 1;
    transform: translateY(0);
    
  }
  
}
@keyframes wiggle {
  25% {
    transform: rotate(-9deg);
    
  }
  75% {
    transform: rotate(9deg);
    
  }
  
}
@media (max-width: 560px) {
  main {
    padding: 24px 20px;
    
  }
  .welcome {
    min-height: 380px;
    padding: 62px 20px 128px;
    border-radius: 22px;
    
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .18em;
    
  }
  h1 {
    font-size: clamp(24px, 6vw, 32px);
    
  }
  .invitation {
    font-size: 17px;
    letter-spacing: .02em;
    
  }
  .cat-link {
    right: 14px;
    bottom: 18px;
    
  }
  .cat {
    width: 62px;
    height: 62px;
    font-size: 48px;
    
  }
  
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    
  }
  
}
/* 用户提供的猫猫按钮图片，嵌入文件内以支持离线打开。 */ .cat-link .cat-photo {
  width:100px;
  height:110px;
  object-fit:cover;
  object-position:center 66%;
  border-radius:18px;
  border:2px solid rgba(255,255,255,.8);
  background:#f5efe5;
  
}
.welcome {
  padding-bottom:170px;
  
}
@media(max-width:560px) {
  .cat-link .cat-photo {
    width:80px;
    height:90px;
    
  }
  .welcome {
    padding-bottom:150px;
    
  }
  .cat-label {
    font-size:14px;
    letter-spacing:.02em;
    
  }
  
}
.cat-link .cat-photo {
  width:120px;
  height:116px;
  object-fit:contain;
  border:0;
  border-radius:0;
  background:transparent;
  filter:drop-shadow(0 3px 4px #23456533);
  
}
@media(max-width:560px) {
  .cat-link .cat-photo {
    width:92px;
    height:92px;
    
  }
  
}
.language-switch {
  position:fixed;
  right:20px;
  top:18px;
  z-index:30;
  display:flex;
  gap:3px;
  padding:4px;
  background:#f7fafdf2;
  border:1px solid #acc0d6;
  border-radius:99px;
  box-shadow:0 3px 12px #193b5f1a;
  font:14px 'Microsoft YaHei',sans-serif
}
.language-switch button {
  border:0;
  border-radius:99px;
  padding:8px 13px;
  background:transparent;
  color:#355574;
  cursor:pointer;
  font:inherit
}
.language-switch button[aria-pressed="true"] {
  background:#557da7;
  color:white
}
.language-switch button:focus-visible {
  outline:3px solid #315b86;
  outline-offset:2px
}
html[lang="en"] .profile-fields dt {
  min-width:95px;
  letter-spacing:0;
  flex-shrink:0
}
html[lang="en"] .profile-fields .hobbies dt {
  min-width:95px
}
html[lang="en"] .letter-lines p {
  text-indent:0;
  text-align:left
}
html[lang="en"] .section-heading h2 {
  letter-spacing:.02em
}
html[lang="en"] .welcome h1 {
  font-size:clamp(25px,4vw,40px);
  letter-spacing:0
}
html[lang="en"] .invitation {
  letter-spacing:0
}
@media(max-width:700px) {
  html[lang="en"] .profile-fields {
    grid-template-columns:1fr
  }
  .language-switch {
    right:12px;
    top:12px
  }
  .home-link {
    top:70px
  }
  .welcome {
    margin-top:32px
  }
  html[lang="en"] .section-nav {
    gap:2px
  }
  html[lang="en"] .section-nav a {
    padding:3px 5px;
    font-size:13px
  }
  
}

</style>
    
  </head>

      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>

try { window.siteLanguage=localStorage.getItem('personal-site-language')==='en'?'en':'zh'; } catch {}
function setSiteLanguage(language){
 window.siteLanguage=language==='en'?'en':'zh';
 try {localStorage.setItem('personal-site-language',window.siteLanguage);} catch {}
 for(const frame of Object.values(frames)){
   if(typeof frame.contentWindow.applyLanguage==='function')frame.contentWindow.applyLanguage(window.siteLanguage);
 }
 updateTitle();
}
function updateTitle(){
 const detail=location.hash==='#profile';
 document.documentElement.lang=window.siteLanguage==='en'?'en':'zh-CN';
 document.title=window.siteLanguage==='en'?(detail?'About me · My little world':'Welcome to my personal website'):(detail?'关于我 · 云朵里的小世界':'欢迎来到我的个人网页');
}
function showPage(name){
 const selected=name==='profile'?'profile':'home';
 for(const key of Object.keys(frames))frames[key].hidden=key!==selected;
 if(location.hash!=='#'+selected)location.hash=selected;
 updateTitle();
}
for(const name of Object.keys(frames)){
 const frame=frames[name];
 frame.addEventListener('load',()=>{
   const script=frame.contentDocument.createElement('script');
   script.textContent=document.getElementById('language-source').textContent;
   frame.contentDocument.body.appendChild(script);
 });
 frame.srcdoc=document.getElementById(name+'-source').textContent;
}
window.addEventListener('hashchange',()=>showPage(location.hash==='#profile'?'profile':'home'));
showPage(location.hash==='#profile'?'profile':'home');

</script>
